<footer class="footer">
  <div class="container inner">
    <p class="closing">{{ site.closingLine }}</p>
    <img
      class="logo"
      src="brand/logo-header.svg"
      [alt]="site.logoAlt"
      width="1080"
      height="600"
      loading="lazy"
      decoding="async"
    />
    <p class="copyright">© {{ year }} {{ site.company }}</p>
  </div>
</footer>
