@if (iconUrl()) {
  <img [src]="iconUrl()" alt="" width="28" height="28" loading="lazy" decoding="async" />
} @else {
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    @switch (kind()) {
      @case ('phone') {
        <path
          d="M5 4h3.5l1.7 4.3-2.2 1.4a11 11 0 0 0 6.3 6.3l1.4-2.2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"
        />
      }
      @case ('whatsapp') {
        <path d="M20 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-4.2A8 8 0 1 1 20 11.5z" />
        <path d="M9 10h6M9 13.5h4" />
      }
      @case ('email') {
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="M3.5 6l8.5 7 8.5-7" />
      }
      @case ('instagram') {
        <rect x="3" y="6" width="18" height="14" rx="2.5" />
        <path d="M8.5 6l1.5-2.5h4L15.5 6" />
        <circle cx="12" cy="13" r="3.5" />
      }
    }
  </svg>
}
