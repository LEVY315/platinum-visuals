<div class="viewport">
  <button
    class="icon-button arrow arrow-prev"
    type="button"
    aria-label="Previous slide"
    (click)="onArrow('prev')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" /></svg>
  </button>

  <div #track class="track" (scroll)="onScroll()">
    @for (item of items(); track $index) {
      <div
        class="slide"
        role="group"
        aria-roledescription="slide"
        [attr.aria-label]="$index + 1 + ' of ' + items().length"
      >
        <ng-container
          *ngTemplateOutlet="itemTemplate(); context: { $implicit: item, index: $index }"
        />
      </div>
    }
  </div>

  <button
    class="icon-button arrow arrow-next"
    type="button"
    aria-label="Next slide"
    (click)="onArrow('next')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" /></svg>
  </button>
</div>

<div class="controls">
  @if (autoplayAllowed()) {
    <button
      class="pause"
      type="button"
      [attr.aria-label]="userPaused() ? 'Play slideshow' : 'Pause slideshow'"
      (click)="toggleAutoplay()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        @if (userPaused()) {
          <path d="M8 5v14l11-7z" class="filled" />
        } @else {
          <path d="M9 5v14M15 5v14" />
        }
      </svg>
    </button>
  }
  <div class="dots">
    @for (index of positions(); track index) {
      <button
        class="dot"
        type="button"
        [class.is-current]="index === position()"
        [attr.aria-current]="index === position() ? 'true' : null"
        [attr.aria-label]="dotLabel(index)"
        (click)="onDot(index)"
      ></button>
    }
  </div>
</div>
